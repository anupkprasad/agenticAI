# Example configuration for agenticAI
hpc:
  host: your.hpc.example.com
  port: 22
  username: your_user
  # private_key_path: /home/user/.ssh/id_rsa
  # password: null

simulation:
  engine: gromacs
  md_steps: 500000
  timestep_fs: 2
  temperature_k: 300

paths:
  remote_workdir: /scratch/${USER}/agentic_runs
  local_results_dir: results/
