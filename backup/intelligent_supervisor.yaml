agents:
  preprocessing:
    name: "PDB Preprocessing Agent"
    description: "Handles PDB file cleaning, validation, and preparation for simulation. Removes heteroatoms, fixes missing atoms, resolves alternate conformations."
    capabilities:
      - "PDB file validation and cleaning"
      - "Missing atom reconstruction"
      - "Alternate conformation resolution"
      - "Force field topology generation"
      - "Structural quality assessment"
    input_requirements:
      - "raw_pdb: Path to input PDB file"
    output_provides:
      - "cleaned_pdb: Processed structure file"
      - "topology: System topology file"
    skip_conditions:
      - "User mentions PDB is already cleaned"
      - "User provides processed structure files"
      - "User explicitly requests to skip preprocessing"

  setup:
    name: "Simulation Setup Agent" 
    description: "Creates simulation system including solvation, ion addition, and energy minimization. Prepares all files needed for MD simulation."
    capabilities:
      - "System solvation with water models"
      - "Ion addition for physiological conditions"
      - "Simulation box definition"
      - "Energy minimization protocols"
      - "Equilibration procedures"
    input_requirements:
      - "cleaned_pdb: Processed structure"
      - "topology: System topology"
    output_provides:
      - "coordinates: Final simulation coordinates"
      - "mdp_files: Simulation parameter files"
    skip_conditions:
      - "User mentions simulation is already set up"
      - "User provides ready-to-run simulation files"

  hpc:
    name: "HPC Job Submission Agent"
    description: "Handles high-performance computing job submission and monitoring. Manages queue systems and resource allocation."
    capabilities:
      - "SLURM/PBS job script generation"
      - "Resource requirement estimation"
      - "Job submission and monitoring"
      - "Queue management"
    input_requirements:
      - "coordinates: Simulation system"
      - "mdp_files: Simulation parameters"
    output_provides:
      - "job_id: HPC job identifier"
      - "job_status: Submission status"
    skip_conditions:
      - "User wants local simulation"
      - "User has already submitted jobs"

  analysis:
    name: "Trajectory Analysis Agent"
    description: "Performs post-simulation analysis of MD trajectories. Calculates structural and dynamic properties."
    capabilities:
      - "RMSD/RMSF calculations"
      - "Secondary structure analysis"
      - "Energy analysis"
      - "Custom property calculations"
    input_requirements:
      - "trajectory: MD trajectory files"
      - "coordinates: Reference structure"
    output_provides:
      - "analysis_results: Analysis data and plots"
    skip_conditions:
      - "User only wants simulation setup"
      - "Simulation is still running"

workflow:
  default_pipeline:
    - "preprocessing"
    - "setup" 
    - "hpc"
    - "analysis"
  
  entry_points:
    - "preprocessing"  # Normal start
    - "setup"         # Skip preprocessing  
    - "hpc"           # Ready to submit
    - "analysis"      # Post-simulation

supervisor:
  llm_config:
    temperature: 0.1  # Low temperature for consistent routing decisions
    max_tokens: 500
    system_prompt: |
      You are an expert MD simulation workflow supervisor. You understand complex user requests and route them to appropriate field-specific agents.
      
      Analyze the user's request and determine:
      1. What the user wants to accomplish
      2. What stage their data/files are in
      3. Which agents need to be involved
      4. In what order agents should be called
      
      Always be intelligent about skipping unnecessary steps based on user input.

  conversation:
    max_turns: 5  # Maximum supervisor-agent conversations per decision
    log_all_interactions: true
