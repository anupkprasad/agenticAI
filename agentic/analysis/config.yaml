# Analysis Agent Configuration
#
# NOTE: Tool definitions (names, descriptions, args) are auto-discovered from tools.py
# This file focuses on agent identity, default parameters, and LLM planning templates

agent:
  name: "AnalysisAgent"
  description: "Performs structural and dynamic analysis of MD simulation trajectories"
  capabilities:
    - "Calculate RMSD (Root Mean Square Deviation) for structural stability assessment"
    - "Calculate RMSF (Root Mean Square Fluctuation) for residue flexibility analysis"
    - "Compute radius of gyration for protein compactness"
    - "Analyze energy terms (potential, kinetic, temperature, pressure)"
    - "Extract trajectory metrics and statistics"
    - "Compute DCCM (dynamic cross-correlation) for correlated motion"
    - "PCA and free-energy landscape (FEL) for conformational dynamics"
  
  # Directory management
  working_directory: "working_dir/analysis"  # All analysis outputs go here
  input_from: "working_dir/hpc"  # Get trajectory/topology from HPC output
  
  # Execution settings
  max_tool_retries: 2  # Max retries per tool on failure
  max_total_steps: 50  # Overall + qualified subset + per-interface H-bond/salt-bridge
  fail_fast: false  # Continue on failures to complete other analyses
  use_trajectory_batching: true  # Share trajectory loads across metrics (RAW/ALIGNED passes)

# Analysis workflow defaults
workflow:
  # Default analyses to run
  default_analyses:
    - "rmsd"
    - "rmsf"
    - "gyration"
    - "energy"
  
  # Output settings
  generate_plots: true
  save_intermediate_data: true
  compress_outputs: false

# Tool-specific settings
tools:
  calculate_rmsd:
    description: "Calculate RMSD to assess structural stability over time"
    defaults:
      selection: "protein and name CA"  # C-alpha atoms
      reference_frame: 0  # First frame as reference
      output_format: "dat"  # dat, csv, or xvg
    interpretations:
      stable: "< 2.0 Å"
      moderate_drift: "2.0-5.0 Å"
      significant_drift: "> 5.0 Å"
  
  calculate_rmsf:
    description: "Calculate per-residue fluctuations to identify flexible regions"
    defaults:
      selection: "protein and name CA"
      output_format: "dat"
    interpretations:
      rigid: "< 1.0 Å"
      moderate_flexibility: "1.0-3.0 Å"
      high_flexibility: "> 3.0 Å"
  
  calculate_radius_of_gyration:
    description: "Measure protein compactness over time"
    defaults:
      selection: "protein"
      output_format: "dat"
      align_before_rg: false
    interpretations:
      compact: "Rg stable with low std"
      expanding: "Rg increasing trend"
      collapsing: "Rg decreasing trend"
  
  analyze_energy:
    description: "Extract and analyze thermodynamic properties"
    defaults:
      terms:
        - "Potential"
        - "Kinetic-En."
        - "Temperature"
        - "Pressure"
        - "Total-Energy"
      output_format: "xvg"
    interpretations:
      equilibrated: "Energy stable with constant mean"
      drifting: "Energy showing trend"
      unstable: "Large energy fluctuations"
  
  extract_trajectory_metrics:
    description: "Get basic trajectory information"
    provides:
      - "Number of frames"
      - "Time range"
      - "File size"
      - "Sampling frequency"

  calculate_trajectory_pca:
    description: "Principal component analysis on aligned Cα coordinates"
    defaults:
      selection: "protein and name CA"
      n_components: 10
      frame_interval: 1
      reference_frame: 0
      projections_file: "pca_projections.dat"
      variance_file: "pca_variance.dat"
    workflow: "Run before plot_pca_projection and calculate_free_energy_landscape"

  plot_pca_projection:
    description: "Scatter plot of two principal components (typically PC1 vs PC2)"
    defaults:
      pc_x: 1
      pc_y: 2
      output_file: "pca_pc1_pc2_time.png"

  calculate_free_energy_landscape:
    description: "Free energy F = -kT ln P from PC1/PC2 density (kJ/mol, min=0)"
    defaults:
      pc_x: 1
      pc_y: 2
      bins: 50
      temperature_k: 310.0
      output_plot: ""
      output_grid: "fel_pc1_pc2_grid.csv"

  analyze_fel_landscape_features:
    description: "FEL classification metrics — minima, basins, barriers, entropy"
    defaults:
      fel_grid_file: "fel_pc1_pc2_grid.csv"
      output_json: "fel_features.json"
      output_csv: "fel_features.csv"
      output_basins_csv: "fel_basins.csv"
      output_plot: "fel_basins.png"
      smooth_sigma: 2.0
      min_basin_population: 0.05
      min_prominence_kj_mol: 1.5
    workflow: "Run after calculate_free_energy_landscape; use collect_fel_features_table across sims"

  export_fel_basin_structures:
    description: "Representative PDB per FEL basin (up to 8) + fel_basin_structures.csv manifest"
    defaults:
      fel_features_file: "fel_features.json"
      pca_projections_file: "pca_projections.dat"
      manifest_file: "fel_basin_structures.csv"
    workflow: "Run after analyze_fel_landscape_features; writes basin_XX.pdb in analysis/"

  collect_fel_features_table:
    description: "Aggregate fel_features.json from all simulations into one CSV"
    defaults:
      output_file: "fel_classification_features.csv"
    phase: combined_analysis

  calculate_protein_ligand_contacts:
    description: "Protein-ligand H-bond and heavy-atom contact counts per frame"
    defaults:
      ligand_selection: "resname ATP"
      contact_cutoff: 4.0
      hbond_distance: 3.0
      output_file: "protein_ligand_contacts.csv"

  calculate_pocket_sasa:
    description: "SASA of binding pocket residues (frame-0 pocket definition)"
    defaults:
      ligand_selection: "resname ATP"
      pocket_cutoff: 5.0
      output_file: "pocket_sasa.csv"

  analyze_ligand_residence:
    description: "Bound/unbound residence times and unbinding event counts"
    defaults:
      ligand_selection: "resname ATP"
      bound_distance_A: 5.0
      output_file: "ligand_residence.csv"

  calculate_pocket_rmsf:
    description: "Per-residue RMSF for pocket Cα atoms only"
    defaults:
      ligand_selection: "resname ATP"
      pocket_cutoff: 5.0
      output_file: "pocket_rmsf.dat"

  calculate_ligand_rmsf:
    description: "Per-atom RMSF of ligand heavy atoms (protein-aligned)"
    defaults:
      ligand_selection: "resname ATP"
      output_file: "ligand_rmsf.dat"
      output_json: "ligand_rmsf.json"

  collect_classification_features_table:
    description: "One-row-per-sim feature matrix for ML/clustering (+ z-score file)"
    defaults:
      output_file: "classification_features.csv"
      zscore_output_file: "classification_features_zscore.csv"
    phase: combined_analysis

  cluster_classification_features:
    description: "Hierarchical (default) or k-means clustering on z-score feature table + labeled plots"
    defaults:
      features_file: "classification_features_zscore.csv"
      method: "hierarchical"
      linkage_method: "ward"
      assignments_file: "classification_cluster_assignments.csv"
      scatter_plot_file: "classification_clusters_pca.png"
      dendrogram_file: "classification_dendrogram.png"
      phylo_tree_file: "classification_phylo_tree.png"
    phase: combined_analysis

  plot_cluster_feature_trajectories:
    description: "Per-cluster trajectory subplots for pocket SASA, COM distance, contacts, residence"
    defaults:
      assignments_file: "classification_cluster_assignments.csv"
    phase: combined_analysis

  plot_cluster_rmsf_profiles:
    description: "Per-cluster pocket/ligand RMSF profile subplots"
    defaults:
      assignments_file: "classification_cluster_assignments.csv"
    phase: combined_analysis

  run_combined_binding_rmsf_overlay:
    description: "Overlay pocket or ligand RMSF profiles across holo simulations"
    defaults:
      profile_type: "pocket_rmsf"
    phase: combined_analysis

  build_sequence_phylo_tree:
    description: "Sequence-based phylogenetic tree from sequences extracted from each simulation's PDB (pairwise % identity, UPGMA)"
    defaults:
      plot_file: "sequence_phylo_tree.png"
      newick_file: "sequence_phylo_tree.nwk"
      distance_matrix_file: "sequence_phylo_distance_matrix.csv"
    phase: combined_analysis

  build_structure_phylo_tree:
    description: "Structure-based phylogenetic tree from CA coordinates of each simulation's PDB (sequence-aligned CA-RMSD, UPGMA)"
    defaults:
      plot_file: "structure_phylo_tree.png"
      newick_file: "structure_phylo_tree.nwk"
      distance_matrix_file: "structure_phylo_distance_matrix.csv"
    phase: combined_analysis

  build_consensus_sequence_alignment:
    description: "Star MSA to a reference (pairwise vs reference, BLOSUM62); exports residue map for reference PCA and consensus pocket transfer"
    defaults:
      alignment_fasta: "reference_msa_alignment.fasta"
      residue_map_csv: "reference_msa_residue_map.csv"
      alignment_json: "reference_msa_alignment.json"
      min_coverage: 0.85
    phase: combined_analysis

  plot_reference_msa_alignment:
    description: "Plot star-MSA as full alignment + focused pocket/high-consensus panel (paper-style)"
    defaults:
      alignment_fasta: "reference_msa_alignment.fasta"
      pocket_definition_json: "reference_pocket_definition.json"
      full_plot_file: "reference_msa_full.png"
      focused_plot_file: "reference_msa_pocket.png"
      min_occupancy: 0.90
      min_conservation: 0.40
      target_n_columns: 40
    phase: combined_analysis

  calculate_consensus_torsions:
    description: "Consensus-mapped φ/ψ/χ₁ torsions (paper Ward-4 χ₁ pocket)"
    defaults:
      output_dir: "consensus_dihedrals"
      angles: ["phi", "psi", "chi1"]
      residue_scope: "mapped"
      alignment_json: "reference_msa_alignment.json"
    phase: per_simulation

  calculate_consensus_rmsf_features:
    description: "Consensus-mapped Cα RMSF mean/std (paper Ward-4)"
    defaults:
      output_dir: "consensus_rmsf"
      alignment_json: "reference_msa_alignment.json"
    phase: per_simulation

  calculate_consensus_dccm_features:
    description: "Consensus-mapped DCCM N↔C correlation (paper Ward-4)"
    defaults:
      output_dir: "consensus_DCCM"
      alignment_json: "reference_msa_alignment.json"
    phase: per_simulation

  run_independent_dynamics_fel:
    description: "Independent dihedral PCA → FEL grid entropy (paper Ward-4 pca_grid_entropy)"
    defaults:
      space: "dihedral"
      method: "pca"
      dihedral_dir: "consensus_dihedrals"
      dihedral_angles: ["phi", "psi", "chi1"]
      output_dir: "consensus_PCA"
    phase: per_simulation

  fit_reference_pca_model:
    description: "Fit reference-projected PCA on consensus Cα from a reference trajectory"
    defaults:
      consensus_json: "reference_msa_alignment.json"
      output_model: "reference_pca_model.json"
      n_components: 10
    phase: combined_analysis

  project_simulations_reference_pca:
    description: "Project all simulation trajectories onto a saved reference PCA model (consensus Cα)"
    defaults:
      model_file: "reference_pca_model.json"
      consensus_json: "reference_msa_alignment.json"
      output_subdir: "reference_fel"
    phase: combined_analysis

  build_shared_reference_fel_landscapes:
    description: "Build FEL in a shared PC1/PC2 grid from reference-projected PCA across simulations"
    defaults:
      projections_subdir: "reference_fel"
      output_subdir: "reference_fel"
      bins: 50
      temperature_k: 310.0
      min_basin_population: 0.05
    phase: combined_analysis

  cluster_reference_fel_landscapes:
    description: "Cluster simulations from shared-reference FEL features; dendrogram + phylo tree"
    defaults:
      features_table: "ref_fel_features_table.json"
      assignments_file: "ref_fel_cluster_assignments.csv"
      dendrogram_file: "ref_fel_dendrogram.png"
      phylo_tree_file: "ref_fel_phylo_tree.png"
    phase: combined_analysis

  run_reference_landscape_pipeline:
    description: "End-to-end reference landscape workflow: consensus alignment → PCA → shared FEL → clustering"
    defaults:
      reference_label: ""
      min_coverage: 0.85
      n_components: 10
      bins: 50
      temperature_k: 310.0
    phase: combined_analysis

  define_reference_consensus_pocket:
    description: "Define reference ligand pocket = star-MSA consensus positions within cutoff of ligand at frame 0; basis for all pocket feature transfer"
    defaults:
      consensus_json: "reference_msa_alignment.json"
      ligand_selection: "resname ATP"
      pocket_cutoff_A: 15.0
      output_json: "reference_pocket_definition.json"
      residue_map_csv: "reference_pocket_residue_map.csv"
    phase: combined_analysis

  map_consensus_pocket_residues:
    description: "Map reference pocket definition to per-simulation PDB residue lists"
    defaults:
      definition_json: "reference_pocket_definition.json"
      min_coverage: 0.5
    phase: combined_analysis

  calculate_consensus_pocket_metrics:
    description: "Compute reference-pocket SASA, COM distance, contacts, residence, and RMSF"
    defaults:
      output_prefix: "reference_pocket"
      ligand_selection: "resname ATP"
    phase: combined_analysis

  run_consensus_pocket_metrics_batch:
    description: "End-to-end reference pocket define → map → metrics under analysis/reference_pocket"
    defaults:
      reference_label: "q8nb16"
      consensus_json: "reference_msa_alignment.json"
      pocket_cutoff_A: 15.0
      min_coverage: 0.5
    phase: combined_analysis

# LLM-powered analysis planning configuration
llm:
  planning_prompt_template: |
    You are an MD trajectory analysis expert. Analyze the simulation results and create a comprehensive analysis plan.

    **System Information:**
    - Trajectory File: {trajectory_file}
    - Topology File: {topology_file}
    - Energy File: {energy_file}
    - User Goal: {user_goal}
    - Enriched User Goal (PRIMARY per-simulation scope): {enriched_goal}
    - HPC Output Directory: {hpc_output_dir}

    **Analysis Context:**
    {analysis_context}

    **Available Tools:**
    {tools_list}

    **Your Task:**
    Create a detailed, step-by-step analysis plan covering **every** metric in the Enriched User Goal.
    Include a calculate_*/analyze_* step plus plot_md_data (or plot_pca_projection) for each metric.
    Do not stop after the first metric — a partial plan is invalid.

    **CRITICAL INSTRUCTIONS:**
    - You MUST ONLY use the tools listed above - do NOT invent non-existent tools
    - Every "tool_name" must exactly match one of the available tool names
    - FORBIDDEN tool names: "none", "manual", "skip", "custom", "placeholder", or any made-up tool
    - If a step cannot be performed with available tools, OMIT it from your plan entirely
    - Do NOT include steps with tool_name="none" or tool_name="manual"
    - Standard workflow: RMSD → RMSF → Gyration → Energy → Statistics
    - All analyses should use appropriate atom selections (e.g., "protein and name CA" for RMSD)

    **CRITICAL FILE PATH RULES:**
    - Use ONLY filenames (e.g., "md.xtc", "md.gro") - NO directory paths!
    - DO NOT use paths like "working_dir/hpc/md.xtc" or "analysis/output.dat"
    - The system automatically prepends the correct directory (working_dir/analysis/)
    - DO NOT specify output_dir paths in tool_params
    - Example: Use "trajectory_file": "md.xtc" NOT "trajectory_file": "working_dir/hpc/md.xtc"

    **ATOM SELECTION GUIDELINES:**
    - RMSD: Use "protein and name CA" (C-alpha atoms) for overall stability
    - RMSF: Use "protein and name CA" for per-residue flexibility
    - Gyration: Use "protein" for whole structure compactness
    - For ligand systems: Consider "protein or resname LIG" selections
    - Avoid hydrogen atoms: Use "not name H*" for heavy atom analyses
    - Multi-chain complexes: GROMACS trajectories have no chain IDs. Still write
      PDB-style selections such as "chainID B and resid 50:75" or
      "chainID A and resid 1:10 and name CA". Analysis translates these to
      trajectory resindex via simsetup/chain_residue_map.json. Always include
      chainID when residue numbers overlap across chains.

    **Output Format:**
    Return a JSON object with this exact structure:
    {{
      "reasoning": "Your scientific reasoning for this analysis approach (2-3 sentences)",
      "overview": "High-level summary of the analysis strategy",
      "steps": [
        {{
          "name": "Human-readable step name",
          "description": "What this analysis step accomplishes",
          "tool_name": "exact_tool_name_from_list",
          "tool_params": {{
            "param1": "value1",
            "param2": "value2"
          }},
          "reason": "Why this analysis is important"
        }}
      ],
      "potential_issues": ["Issue 1 to watch for", "Issue 2"],
      "recommendations": ["Best practice 1", "Best practice 2"]
    }}

    **MANDATORY PLOTTING RULE:**
    - After EVERY calculate_* or analyze_* step that writes a data file, you MUST add a plot_md_data step
      that reads that data file and saves a PNG plot.  NO EXCEPTIONS.
    - Every plot step must reference the output_file from the preceding calculation step as its data_files input.

    **Example Steps for Standard Protein Analysis (WITH REQUIRED PLOTS):**
    1. calculate_rmsd
       - tool_params: {{"topology_file": "md.gro", "trajectory_file": "md.xtc", "selection": "protein and name CA", "output_file": "rmsd.dat"}}
    2. plot_md_data  ← REQUIRED after calculate_rmsd
       - tool_params: {{"data_files": ["rmsd.dat"], "output_file": "rmsd.png", "xlabel": "Time (ns)", "ylabel": "RMSD (Å)"}}
    3. calculate_rmsf
       - tool_params: {{"topology_file": "md.gro", "trajectory_file": "md.xtc", "selection": "protein and name CA", "output_file": "rmsf.dat"}}
    4. plot_md_data  ← REQUIRED after calculate_rmsf
       - tool_params: {{"data_files": ["rmsf.dat"], "output_file": "rmsf.png", "xlabel": "Residue", "ylabel": "RMSF (Å)"}}
    5. calculate_radius_of_gyration
       - tool_params: {{"topology_file": "md.gro", "trajectory_file": "md.xtc", "selection": "protein", "output_file": "gyration.dat"}}
    6. plot_md_data  ← REQUIRED after calculate_radius_of_gyration
       - tool_params: {{"data_files": ["gyration.dat"], "output_file": "gyration.png", "xlabel": "Time (ns)", "ylabel": "Rg (Å)"}}
    7. analyze_energy
       - tool_params: {{"energy_file": "md.edr", "terms": ["Potential", "Temperature", "Pressure"], "output_file": "energy.dat"}}
    8. plot_md_data  ← REQUIRED after analyze_energy
       - tool_params: {{"data_files": ["energy.dat"], "output_file": "energy.png", "xlabel": "Time (ns)", "ylabel": "Energy (kJ/mol)"}}
    9. extract_trajectory_metrics (no plot needed — gives trajectory metadata)
       - tool_params: {{"trajectory_file": "md.xtc", "topology_file": "md.gro"}}

    **COM distance — choose ONE tool (do not run both unless the user asks for both):**

    A) **Ligand pocket distance** — binding-site / catalytic pocket tracking (preferred for holo kinases):
    10. calculate_ligand_pocket_distance
        - When: "ligand pocket distance", "ATP in the pocket", "binding site", "atoms within 5 Å of ATP"
        - tool_params: {{"topology_file": "md.gro", "trajectory_file": "md.xtc", "ligand_selection": "resname ATP", "cutoff": 5.0, "output_file": "ligand_pocket_distance.csv"}}
    11. plot_md_data  ← REQUIRED plot
        - tool_params: {{"data_files": ["ligand_pocket_distance.csv"], "output_file": "ligand_pocket_distance.png", "xlabel": "Time (ns)", "ylabel": "Pocket COM Distance (Å)"}}

    B) **Whole-protein COM distance** — explicit two-group COM (NOT pocket-defined):
    10b. calculate_com_distance
        - When: "COM distance between the **whole protein** and ATP", domain–domain COM, chain–chain COM
        - tool_params: {{"topology_file": "md.gro", "trajectory_file": "md.xtc", "selection1": "protein", "selection2": "resname ATP", "label1": "Protein", "label2": "ATP", "output_file": "com_distance.csv"}}
        - Use selection1/selection2 — NOT ligand_selection
    11b. plot_md_data
        - tool_params: {{"data_files": ["com_distance.csv"], "output_file": "com_distance.png", "xlabel": "Time (ns)", "ylabel": "COM Distance (Å)"}}

    **DCCM (include when user mentions correlation, DCCM, allosteric, cross-correlation, coupled motions, pseudokinase):**
    12. calculate_dccm
        - tool_params: {{"topology_file": "md.gro", "trajectory_file": "md.xtc", "selection": "protein and name CA", "output_prefix": "dccm", "frame_interval": 5, "save_matrix_csv": true, "create_heatmap": true}}
        (note: no separate plot step needed — calculate_dccm produces its own heatmap PNG internally)

    **DCCM difference (protein-only vs protein+ligand / ATP effect on dynamics):**
    Run calculate_dccm on EACH simulation first (same selection: "protein and name CA"), then:
    13. plot_dccm_difference
        - tool_params: {{"reference_dccm_file": "path/to/protein_only/analysis/dccm.csv", "compare_dccm_file": "path/to/protein_atp/analysis/dccm.csv", "reference_label": "Protein only", "compare_label": "Protein + ATP", "output_prefix": "dccm_difference", "plot_mode": "difference_only"}}
        (ΔC_ij = compare − reference; positive = stronger correlation with ligand, negative = weaker)
    Or for two completed sim directories:
    13b. run_combined_dccm_difference
        - tool_params: {{"reference_sim_dir": "...", "compare_sim_dir": "...", "reference_label": "Protein only", "compare_label": "Protein + ATP", "working_dir": "combined_analysis"}}

    **Combined apo vs holo (multi-simulation workflows — preferred for ligand-effect studies):**
    14. run_combined_rmsf_apo_holo_analysis
        - One panel per protein with apo and holo RMSF overlaid (not all 8 sims on one plot).
    15. run_combined_dccm_apo_holo_analysis
        - Per protein: 3-panel figure — apo DCCM | holo DCCM | Δ(holo − apo).
    16. run_combined_rmsf_segment_apo_holo_analysis
        - Active-site / segment RMSF bar plots per protein (apo vs holo only).
    Note: calculate_ligand_pocket_distance runs on holo simulations only (apo has no ligand).

    **Analysis Interpretation Guidelines:**
    - RMSD < 2.0 Å: Stable structure
    - RMSD 2.0-5.0 Å: Moderate drift
    - RMSD > 5.0 Å: Significant structural changes
    - RMSF < 1.0 Å: Rigid regions (core, secondary structure)
    - RMSF > 3.0 Å: Flexible regions (loops, termini)

    Remember: Focus on analyses that directly address the user's goals and provide actionable insights!
    Remember: ALWAYS use exact tool names from the available tools list!


selection_presets:
  protein_backbone:
    selection: "protein and (name CA or name C or name N or name O)"
    description: "Protein backbone atoms"
  
  protein_ca:
    selection: "protein and name CA"
    description: "Protein C-alpha atoms (standard for RMSD/RMSF)"
  
  protein_heavy:
    selection: "protein and not name H*"
    description: "All protein heavy atoms"
  
  binding_site:
    selection: "protein and (resid 50-100)"
    description: "Binding site residues (customize resid range)"
  
  ligand:
    selection: "resname LIG"
    description: "Ligand molecule (customize resname)"
  
  protein_ligand:
    selection: "(protein or resname LIG) and not name H*"
    description: "Protein and ligand heavy atoms"

# Analysis result interpretation guidelines
interpretation:
  rmsd:
    excellent: "< 1.5 Å - Very stable structure"
    good: "1.5-3.0 Å - Stable structure with minor fluctuations"
    moderate: "3.0-5.0 Å - Moderate structural changes"
    concerning: "> 5.0 Å - Significant structural drift, may need longer equilibration"
  
  rmsf:
    low: "< 1.0 Å - Rigid region (core, secondary structure)"
    medium: "1.0-3.0 Å - Moderate flexibility (typical for structured regions)"
    high: "> 3.0 Å - High flexibility (loops, termini, unstructured regions)"
  
  gyration:
    stable: "std/mean < 0.05 - Compact, stable structure"
    moderate: "0.05-0.10 - Some conformational changes"
    unstable: "> 0.10 - Significant compactness changes (folding/unfolding?)"
  
  temperature:
    good: "Within 5K of target - Good temperature control"
    acceptable: "5-10K from target - Acceptable fluctuations"
    poor: "> 10K from target - Temperature control issues"

# File format specifications
file_formats:
  input:
    topology:
      - ".gro"  # GROMACS coordinate file
      - ".pdb"  # Protein Data Bank file
      - ".tpr"  # GROMACS portable binary run file
    trajectory:
      - ".xtc"  # GROMACS compressed trajectory
      - ".trr"  # GROMACS full-precision trajectory
      - ".dcd"  # CHARMM/NAMD trajectory
    energy:
      - ".edr"  # GROMACS energy file
  
  output:
    data:
      - ".dat"  # Plain text data (default)
      - ".csv"  # Comma-separated values
      - ".xvg"  # GROMACS xvgr/grace format
    plots:
      - ".png"  # PNG image
      - ".pdf"  # PDF document
      - ".svg"  # Scalable vector graphics

# Dependencies and fallback behavior
dependencies:
  preferred:
    - "MDAnalysis"  # Python library for trajectory analysis
    - "numpy"  # Numerical operations
    - "matplotlib"  # Plotting (if generate_plots=true)
  
  fallback:
    method: "gromacs_tools"  # Use gmx rms, gmx rmsf, gmx gyrate, gmx energy
    available_tools:
      - "gmx rms"
      - "gmx rmsf"
      - "gmx gyrate"
      - "gmx energy"
      - "gmx check"

# Agent behavior settings
behavior:
  # What to do when trajectory/topology not found
  missing_files: "report_error"  # report_error, skip, or prompt_user
  
  # How to handle analysis failures
  on_tool_failure: "continue"  # continue, stop, or retry
  
  # Whether to validate inputs before analysis
  validate_inputs: true
  
  # LLM planning settings
  llm_planning:
    enabled: true
    plan_before_execution: true
    adaptive_analysis: true  # Adjust analysis based on trajectory characteristics
    
# Report generation
report:
  format: "markdown"  # markdown, json, or html
  include_plots: true
  include_raw_data: false
  summary_statistics: true
  interpretation_guidance: true
  output_filename: "analysis_report.md"
