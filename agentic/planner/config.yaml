# MD Planner Configuration
# Natural language detailed execution planning with dynamic tools and knowledge

planner:
  name: "MD Workflow Planner"
  version: "2.0"
  description: "LLM-powered planner with dynamic tools discovery and knowledge base access"
  
  # Available agents in the system (DO NOT invent new agents)
  available_agents:
    - name: "preprocess"
      full_name: "Preprocessing Agent"
      description: "Handles PDB cleaning, hydrogen addition, structure validation"
      capabilities: ["analyze_pdb", "separate_complex", "add_hydrogens", "validate_structure"]
      
    - name: "setup"
      full_name: "Setup Agent"
      description: "Handles topology generation, system building, solvation, ligand parameterization"
      capabilities: ["build_topology", "generate_ligand_parameters", "solvate", "add_ions", "generate_mdp", "merge_files"]
      note: "Ligand parameterization is handled by THIS agent, not a separate agent"
      
    - name: "hpc"
      full_name: "HPC Agent"
      description: "Handles job submission and execution on compute clusters"
      capabilities: ["submit_job", "monitor_job", "retrieve_results"]
      
    - name: "analysis"
      full_name: "Analysis Agent"
      description: "Handles trajectory analysis and visualization"
      capabilities: ["rmsd", "rmsf", "gyrate", "dssp", "hbond", "visualization"]
  
  # Planning behavior
  behavior:
    planning_mode: "detailed_natural_language"  # Create detailed NL plans, not structured JSON
    max_iterations: 5
    require_supervisor_approval: true
    auto_create_fallback: true  # Use fallback if LLM unavailable
    use_dynamic_tools: true  # Discover tools from code, not config
    use_knowledge_base: true  # Load domain knowledge from /knowledge
    respect_user_exclusions: true  # CRITICAL: Honor "protein only", "no HPC", "no analysis" instructions
    match_component_selection: true  # Only plan for components user explicitly selected
    
  # Output format for plans
  output_format:
    style: "natural_language_detailed"  # Detailed prose, not just bullet points
    include_rationale: true  # Explain why each step is needed
    include_tool_suggestions: true  # Suggest which tools agents might use
    include_best_practices: true  # Reference knowledge base protocols
    strict_json_parsing: false  # Allow flexible LLM responses
    
  # Natural language plan requirements
  natural_language_plan:
    min_detail_level: "comprehensive"  # high-level, moderate, comprehensive, very-detailed
    include_sections:
      - "goal_interpretation"  # What the user wants (with explicit inclusions/exclusions)
      - "pdb_analysis_summary"  # What we have (and what we'll use vs ignore)
      - "agent_assignments"  # Which agents do what (ONLY needed agents)
      - "execution_sequence"  # Step-by-step in prose (ONLY for selected components)
      - "expected_outcomes"  # What each agent should produce
      - "potential_issues"  # Known challenges
      - "recommendations"  # Best practices
    critical_rules:
      - "Only include agents user needs (skip HPC if 'no HPC', skip Analysis if 'no analysis')"
      - "Respect component selection (if 'protein only', exclude ligand parameterization)"
      - "User's explicit instructions override PDB structure content"
      - "Do not invent agents not in the available agents list"
    
  # Context building
  context:
    tools_discovery: "dynamic"  # auto-discover from tools.py files
    knowledge_sources:
      - "protocols"  # MD protocols and workflows
      - "force_fields"  # Force field documentation
      - "tools_manuals"  # Software command references
      - "md_fundamentals"  # MD theory and best practices
    max_tools_chars: 8000  # Max characters for tools context
    max_knowledge_chars: 8000  # Max characters for knowledge context
    
  # When to use fallback plan (keyword-based)
  fallback_triggers:
    - llm_parsing_failed
    - zero_steps_generated
    - invalid_response_format
    
  # Planning templates for common workflows
  templates:
    preprocessing:
      keywords: ["preprocess", "clean", "missing", "hydrogen", "protonate"]
      agent: "preprocess"  # Preprocessing Agent
      default_steps:
        - name: "PDB Preprocessing"
          agent: "preprocess"
          description: "Clean PDB: remove unwanted atoms, add missing atoms, add hydrogens"
          tools: ["reduce", "pdbfixer", "obabel"]
          
    setup:
      keywords: ["setup", "solvate", "mdp", "simulation", "topology", "ligand", "parameters"]
      agent: "setup"  # Setup Agent (includes ligand parameterization)
      default_steps:
        - name: "Topology Generation"
          agent: "setup"
          description: "Generate topology using force field (includes ligand parameters if needed)"
          tools: ["gmx pdb2gmx", "acpype", "generate_ligand_parameters"]
        - name: "System Solvation"
          agent: "setup"
          description: "Add water box and ions"
          tools: ["gmx solvate", "gmx genion"]
        - name: "MDP File Generation"
          agent: "setup"
          description: "Create parameter files for simulation"
          tools: ["mdp_generator"]
      note: "Ligand parameterization is part of Setup Agent, not a separate agent"
          
    hpc:
      keywords: ["submit", "hpc", "slurm", "run simulation"]
      agent: "hpc"  # HPC Agent
      default_steps:
        - name: "Job Submission"
          agent: "hpc"
          description: "Submit simulation to HPC cluster"
          tools: ["sbatch", "slurm"]
          
    analysis:
      keywords: ["analysis", "rmsd", "rmsf", "trajectory"]
      agent: "analysis"  # Analysis Agent
      default_steps:
        - name: "Trajectory Analysis"
          agent: "analysis"
          description: "Analyze simulation results"
          tools: ["gmx rms", "gmx rmsf", "gmx gyrate"]

# Knowledge resources for planning
knowledge_resources:
  force_fields:
    amber99sb-ildn:
      description: "AMBER force field for proteins"
      suitable_for: ["proteins", "peptides"]
      tools: ["gmx pdb2gmx", "tleap"]
      
    charmm36:
      description: "CHARMM force field for proteins and lipids"
      suitable_for: ["proteins", "lipids", "membranes"]
      tools: ["gmx pdb2gmx", "charmm-gui"]
      
    gromos54a7:
      description: "GROMOS force field"
      suitable_for: ["proteins", "small molecules"]
      tools: ["gmx pdb2gmx"]
      
  water_models:
    tip3p:
      description: "3-point water model"
      compatible_with: ["amber99sb-ildn", "charmm36"]
      
    tip4p:
      description: "4-point water model"
      compatible_with: ["gromos54a7"]
      
    spc:
      description: "Simple point charge water"
      compatible_with: ["gromos54a7"]
      
  simulation_engines:
    gromacs:
      description: "GROMACS MD engine"
      commands: ["gmx", "pdb2gmx", "editconf", "solvate", "grompp", "mdrun"]
      file_formats: [".gro", ".top", ".mdp", ".trr", ".xtc"]
      
  preprocessing_tools:
    reduce:
      description: "Add hydrogens with correct protonation states"
      command: "reduce"
      input: [".pdb"]
      output: [".pdb"]
      
    pdbfixer:
      description: "Fix missing residues and atoms"
      command: "pdbfixer"
      input: [".pdb"]
      output: [".pdb"]
      
    obabel:
      description: "Convert and clean molecular structures"
      command: "obabel"
      input: [".pdb", ".mol2", ".sdf"]
      output: [".pdb", ".mol2"]
      
  topology_tools:
    gmx_pdb2gmx:
      description: "Generate topology from PDB with force field"
      agent: "setup"
      command: "gmx pdb2gmx"
      
    acpype:
      description: "Generate topology for small molecules"
      agent: "setup"
      command: "acpype"

# Logging and transparency
logging:
  log_llm_prompts: true
  log_llm_responses: true
  log_parsing_details: true
  save_plans_to_file: true
  plan_output_dir: "working_dir/plans"
