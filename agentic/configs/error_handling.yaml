# Error Handling and Escalation Configuration

# Error classification patterns
error_patterns:
  file_errors:
    - pattern: "FileNotFoundError|No such file"
      severity: "moderate"
      suggested_action: "check_file_path"
      escalate_to_planner: false
      
    - pattern: "PermissionError"
      severity: "critical"
      suggested_action: "check_permissions"
      escalate_to_planner: true
  
  execution_errors:
    - pattern: "gromacs.*failed|gmx.*error"
      severity: "critical"
      suggested_action: "check_gromacs_setup"
      escalate_to_planner: true
      
    - pattern: "Command.*not found"
      severity: "critical"
      suggested_action: "install_missing_tool"
      escalate_to_planner: true
  
  parameter_errors:
    - pattern: "invalid.*parameter|parameter.*out of range"
      severity: "moderate"
      suggested_action: "use_default_parameter"
      escalate_to_planner: false
      
    - pattern: "missing.*required"
      severity: "moderate"
      suggested_action: "request_missing_input"
      escalate_to_planner: false
  
  llm_errors:
    - pattern: "LLM.*unavailable|connection.*refused"
      severity: "minor"
      suggested_action: "use_fallback_logic"
      escalate_to_planner: false
      
    - pattern: "parsing.*failed|invalid.*response"
      severity: "moderate"
      suggested_action: "retry_with_different_prompt"
      escalate_to_planner: false

# Agent-specific error handling
agent_error_handling:
  preprocessing:
    retriable_errors:
      - "water_removal_warning"
      - "hydrogen_addition_partial"
    critical_errors:
      - "pdb_structure_invalid"
      - "force_field_incompatible"
    auto_fallback:
      enabled: true
      fallback_strategy: "use_default_tools"
  
  setup:
    retriable_errors:
      - "box_size_suboptimal"
      - "ion_concentration_adjusted"
    critical_errors:
      - "topology_generation_failed"
      - "solvation_failed"
    auto_fallback:
      enabled: true
      fallback_strategy: "use_template_config"
  
  hpc:
    retriable_errors:
      - "queue_full"
      - "resource_temporarily_unavailable"
    critical_errors:
      - "authentication_failed"
      - "disk_quota_exceeded"
    auto_fallback:
      enabled: false
      fallback_strategy: null
  
  analysis:
    retriable_errors:
      - "trajectory_frame_skip"
      - "plot_generation_warning"
    critical_errors:
      - "trajectory_corrupt"
      - "analysis_tool_crash"
    auto_fallback:
      enabled: true
      fallback_strategy: "use_alternative_tool"

# Escalation workflow
escalation_workflow:
  field_agent_level:
    max_auto_retry: 2
    retry_delay_seconds: 5
    collect_error_context: true
    log_to: "agent_errors"
  
  supervisor_level:
    triage_strategy: "severity_based"
    can_modify_parameters: true
    can_suggest_alternatives: true
    can_escalate_to_planner: true
    log_to: "supervisor_decisions"
  
  planner_level:
    can_revise_plan: true
    can_invoke_programmer: true
    can_abort_workflow: true
    requires_human_approval: false
    log_to: "planner_revisions"

# Error recovery strategies
recovery_strategies:
  file_not_found:
    actions:
      - action: "search_working_directory"
        priority: 1
      - action: "check_alternative_paths"
        priority: 2
      - action: "request_user_input"
        priority: 3
  
  tool_execution_failure:
    actions:
      - action: "retry_with_modified_params"
        priority: 1
      - action: "use_alternative_tool"
        priority: 2
      - action: "escalate_to_planner"
        priority: 3
  
  resource_unavailable:
    actions:
      - action: "wait_and_retry"
        priority: 1
        max_wait_seconds: 300
      - action: "use_alternative_resource"
        priority: 2
      - action: "abort_and_report"
        priority: 3

# Reporting configuration
error_reporting:
  include_in_report:
    - error_message
    - stack_trace
    - agent_state
    - attempted_recovery
    - escalation_path
  
  notification:
    notify_user_on_critical: true
    notify_user_on_escalation: true
    notification_format: "detailed"
  
  persistence:
    save_error_logs: true
    error_log_directory: "logs/errors"
    create_error_summary: true
