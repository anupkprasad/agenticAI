# Preprocessing Agent Configuration
# 
# NOTE: Tool definitions are auto-discovered from tools.py using get_tool_metadata()
# This file focuses on agent identity, behavior, and workflow orchestration

# Agent Identity
agent:
  name: "Preprocessing Agent"
  role: "PDB Structure Preparation Specialist"
  description: |
    Orchestrates PDB preprocessing workflows for molecular dynamics simulations.
    Uses LLM-guided planning to intelligently select and sequence preprocessing tools.
  capabilities:
    - "Analyze PDB structure and detect issues"
    - "Clean structures (remove waters, resolve alternate locations)"
    - "Add missing hydrogens"
    - "Assign pH-dependent protonation states"
    - "Validate structure integrity"
  
  # Execution limits to prevent infinite loops
  max_tool_retries: 2  # Max retries per tool on failure
  max_total_steps: 20  # Max total steps in a plan
  fail_fast: false     # Stop on first failure or continue
  
# Default preprocessing settings
defaults:
  force_field: "amber99sb-ildn"
  water_model: "tip3p"
  remove_waters: true
  add_hydrogens: true
  ph: 7.0
  keep_occupancy: "highest"  # For alternate locations
  hydrogen_method: "reduce"  # Options: reduce, obabel, none
  protonation_method: "pdb2pqr"  # Options: pdb2pqr, propka, copy

# Standard preprocessing workflows
workflows:
  basic:
    description: "Basic protein extraction and hydrogen addition"
    steps:
      - analyze_pdb
      - separate_protein_ligand
      - add_hydrogens
      - validate_structure

  full:
    description: "Complete preprocessing for MD (protein extraction + hydrogens)"
    steps:
      - analyze_pdb
      - separate_protein_ligand
      - add_hydrogens
      - validate_structure

  minimal:
    description: "Minimal analysis and validation only"
    steps:
      - analyze_pdb
      - validate_structure
  
  protein_only:
    description: "Extract protein and add hydrogens"
    steps:
      - separate_protein_ligand
      - add_hydrogens
      - validate_structure

# Force fields supported
force_fields:
  - name: "amber99sb-ildn"
    description: "AMBER99SB with improved side-chain torsions"
    recommended: true
  - name: "charmm27"
    description: "CHARMM27 all-atom force field"
  - name: "gromos96"
    description: "GROMOS96 united-atom force field"
  - name: "oplsaa"
    description: "OPLS all-atom force field"

# Water models
water_models:
  - name: "tip3p"
    description: "TIP3P 3-site water model"
    recommended: true
  - name: "tip4p"
    description: "TIP4P 4-site water model"
  - name: "spc"
    description: "SPC 3-site water model"
  - name: "spce"
    description: "SPC/E 3-site water model"

# Output file naming conventions (based on actual tool outputs)
output_files:
  cleaned_pdb: "{basename}_cleaned.pdb"
  protein_only: "{basename}_protein.pdb"
  ligand_only: "{basename}_ligand.pdb"
  with_hydrogens: "{basename}_h.pdb"
  validated: "{basename}_validated.pdb"

# LLM prompting configuration
llm:
  planning_prompt_template: |
    You are a molecular dynamics preprocessing expert. Analyze this PDB structure and create a detailed, step-by-step preprocessing plan.
    
    **PDB Information:**
    - File: {pdb_path}
    - User Goal: {user_goal}
    - Force Field: {force_field}
    - Water Model: {water_model}
    
    **Structure Analysis:**
    {analysis}
    
    **Available Tools:**
    {tools_list}
    
    Output as JSON with this structure:
    {{
      "reasoning": "Detailed analysis and strategy",
      "overview": "High-level summary",
      "steps": [
        {{
          "name": "step name",
          "description": "what it does",
          "tool_name": "tool to call",
          "tool_params": {{"param": "value"}},
          "reason": "why it's needed"
        }}
      ],
      "potential_issues": ["issue1"],
      "recommendations": ["rec1"]
    }}

  fallback_enabled: true
  max_retries: 2
  timeout_seconds: 60
