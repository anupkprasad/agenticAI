# Preprocessing Agent Configuration
# 
# NOTE: Tool definitions are auto-discovered from tools.py using get_tool_metadata()
# This file focuses on agent identity, behavior, and workflow orchestration

# Agent Identity
agent:
  name: "Preprocessing Agent"
  role: "PDB Structure Preparation Specialist"
  description: |
    Orchestrates PDB preprocessing workflows for molecular dynamics simulations.
    Uses LLM-guided planning to intelligently select and sequence preprocessing tools.
  capabilities:
    - "Download structures from AlphaFold DB or RCSB PDB by UniProt ID"
    - "Extract protein domains by residue range (Bio.PDB / MDAnalysis)"
    - "Validate domains for missing residues and broken loops"
    - "Align experimental and AlphaFold/model structures by sequence"
    - "Detect and copy missing residues/atoms (e.g. loops, phosphate) from model to experimental PDB"
    - "Remodel structures manually (donor residue range) or automatically (gap detection)"
    - "Analyze PDB structure and detect issues"
    - "Clean structures (remove waters, resolve alternate locations)"
    - "Add missing hydrogens"
    - "Assign pH-dependent protonation states"
    - "Validate structure integrity"
  
  # Execution limits to prevent infinite loops
  max_tool_retries: 2  # Max retries per tool on failure
  max_total_steps: 20  # Max total steps in a plan
  fail_fast: false     # Stop on first failure or continue
  
# Default preprocessing settings
defaults:
  force_field: "amber99sb-ildn"
  water_model: "tip3p"
  remove_waters: true
  add_hydrogens: true
  ph: 7.0
  keep_occupancy: "highest"  # For alternate locations
  hydrogen_method: "reduce"  # Options: reduce, obabel, none
  protonation_method: "pdb2pqr"  # Options: pdb2pqr, propka, copy

# Structure acquisition (when user provides UniProt but no PDB file)
structure_acquisition:
  default_source: auto          # auto | alphafold | rcsb
  source_order:
    - alphafold
    - rcsb
  validate_after_extract: true

# Standard preprocessing workflows
workflows:
  from_uniprot:
    description: "Download structure, extract domain, validate, then preprocess"
    steps:
      - acquire_protein_structure
      - analyze_pdb
      - add_hydrogens
      - validate_structure

  basic:
    description: "Basic protein extraction and hydrogen addition"
    steps:
      - analyze_pdb
      - separate_complex_components
      - add_hydrogens
      - validate_structure

  full:
    description: "Complete preprocessing for MD (protein extraction + hydrogens)"
    steps:
      - analyze_pdb
      - separate_complex_components
      - add_hydrogens
      - validate_structure

  minimal:
    description: "Minimal analysis and validation only"
    steps:
      - analyze_pdb
      - validate_structure
  
  protein_only:
    description: "Extract protein and add hydrogens"
    steps:
      - separate_complex_components
      - add_hydrogens
      - validate_structure

# Force fields supported
force_fields:
  - name: "amber99sb-ildn"
    description: "AMBER99SB with improved side-chain torsions"
    recommended: true
  - name: "charmm27"
    description: "CHARMM27 all-atom force field"
  - name: "gromos96"
    description: "GROMOS96 united-atom force field"
  - name: "oplsaa"
    description: "OPLS all-atom force field"

# Water models
water_models:
  - name: "tip3p"
    description: "TIP3P 3-site water model"
    recommended: true
  - name: "tip4p"
    description: "TIP4P 4-site water model"
  - name: "spc"
    description: "SPC 3-site water model"
  - name: "spce"
    description: "SPC/E 3-site water model"

# Output file naming conventions (based on actual tool outputs)
output_files:
  cleaned_pdb: "{basename}_cleaned.pdb"
  protein_only: "{basename}_protein.pdb"
  ligand_only: "{basename}_ligand.pdb"
  with_hydrogens: "{basename}_h.pdb"
  validated: "{basename}_validated.pdb"

# LLM prompting configuration
llm:
  planning_prompt_template: |
    You are a molecular dynamics preprocessing expert. Analyze this PDB structure and create a detailed, step-by-step preprocessing plan.
    
    **PDB Information:**
    - File: {pdb_path}
    - User Goal: {user_goal}
    - Force Field: {force_field}
    - Water Model: {water_model}
    
    **Structure Analysis:**
    {analysis}
    
    **Available Tools:**
    {tools_list}
    
    **STRUCTURE ACQUISITION (when no local PDB):**
    - If the user mentions a UniProt ID (e.g. P21860 / ERBB3) and a domain or residue range,
      start with `acquire_protein_structure` OR chain `download_structure` → `extract_domain` → `validate_structure`
    - If a domain is named WITHOUT explicit residues (e.g. "kinase domain"), call
      `lookup_domain_range_tool` first — it queries UniProt feature annotations automatically
    - Example kinase domain: lookup P21860 kinase_domain → UniProt residues 709-966,
      download structure, extract_domain → ERBB3_kinase_domain.pdb
    - Do NOT use analysis-only residue ranges (e.g. RMSF window) as the simulation domain
    - Use `validate_structure` with check_domain=true after domain extraction
    - Available download sources: alphafold (default), rcsb (experimental fallback)

    **STRUCTURE REMODELING (experimental + AlphaFold/model PDB):**
    - When experimental PDB has missing loops/residues or atoms (e.g. phosphate on SEP/TPO/PTR),
      use `detect_missing_structure_elements` to compare target vs donor
    - `remodel_structure` merges ONLY missing content from donor into experimental target
      (does not replace existing experimental coordinates)
    - Manual mode: set mode='manual' and donor_residue_range='165-168' to copy specific donor resids
    - Auto mode: sequence alignment + gap detection fills all missing residues/atoms
    - `align_model_to_experimental` superposes donor for visual inspection without merging
    - Typical workflow: download AF3 model → detect_missing_structure_elements → remodel_structure
      → validate_structure → add_hydrogens
    - Run remodel on raw.pdb BEFORE separate_complex_components when possible
    - Phosphorylated structures: normalize_phosphorylation_for_gromacs runs automatically
      after separation when SEP/TPO/PTR are present (maps to SP2/THP1/TP2 for GROMACS)

    **CRITICAL: DO NOT SPECIFY FILE PATHS IN tool_params**
    - The executor assigns canonical preprocess filenames automatically.
    - Planner / LLM should choose tool_name and non-path settings only (mode, ph, check_domain, …).
    - NEVER set pdb_file, target_pdb, donor_pdb, output_file, protein_output, ligand_output, ion_output.
    - Canonical preprocess filenames (executor assigns paths; describe each step):
      raw.pdb (imported structure), reference_af3.pdb (AF3/model reference),
      merged_missing_from_model.pdb (after remodel), protein.pdb (clean protein),
      protein_phospho_mapped.pdb (SEP→SP2, TPO→THP1, PTR→TP2 for GROMACS), protein_h.pdb (final)
    - Phosphorylated proteins: auto-map SEP→SP2, TPO→THP1, PTR→TP2 (O3P→OT); kept in
      protein.pdb — never parameterized as separate ligands
    
    **CRITICAL: DO NOT CONCATENATE OR MERGE FILES**
    - Your job is ONLY to clean and prepare individual components (protein, ligand, ions)
    - DO NOT add steps to merge/concatenate/combine separated files back together
    - File merging is handled by the downstream Setup Agent, NOT here
    - Each component should remain as a separate output file
    - DO NOT use placeholder tools like "none" or "manual" - only use the tools listed above
    
    Output as JSON with this structure:
    {{
      "reasoning": "Detailed analysis and strategy",
      "overview": "High-level summary",
      "steps": [
        {{
          "name": "step name",
          "description": "what it does",
          "tool_name": "tool to call",
          "tool_params": {{"pdb_file": "input.pdb"}},
          "reason": "why it's needed"
        }}
      ],
      "potential_issues": ["issue1"],
      "recommendations": ["rec1"]
    }}

  fallback_enabled: true
  max_retries: 2
  timeout_seconds: 60
