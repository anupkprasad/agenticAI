# Supervisor Configuration for AgenticAI MD Workflow
# Updated: 2026-01-30
# Architecture: Supervisor → Planner → Programmer → Field Agents

# ========================================
# WORKFLOW HIERARCHY
# ========================================
# 1. SUPERVISOR - Main controller and orchestrator
#    - Takes high-level prompts from user
#    - Validates input and rephrases prompts
#    - Collaborates with planner for execution strategy
#    - Assigns tasks to field agents
#    - Monitors overall workflow progress
#
# 2. PLANNER - Strategic planning and coordination
#    - Receives refined prompts from supervisor
#    - Creates detailed execution plans
#    - Has access to tools and resources
#    - Can request programmer to create custom scripts
#    - Returns execution plan to supervisor
#
# 3. PROGRAMMER - Script generation (internal to planner)
#    - Called by planner when custom scripts needed
#    - Generates Python/TCL/Bash scripts
#    - Never directly accessed by supervisor
#
# 4. FIELD AGENTS - Task execution specialists
#    - Preprocess, Setup, HPC, Analysis agents
#    - Execute specific tasks assigned by supervisor
#    - Report results back to supervisor
# ========================================

supervisor:
  # LLM Configuration for supervisor decision-making
  llm_config:
    temperature: 0.1  # Low temperature for consistent routing decisions
    max_tokens: 500
    system_prompt: |
      You are the main controller of an MD simulation workflow system. Your responsibilities:
      
      PRIMARY ROLE:
      1. Accept high-level prompts from users
      2. Validate and extract input files (PDB, etc.)
      3. Rephrase user goals into clear, structured prompts
      4. Pass refined prompts to the planner for execution strategy
      5. Receive execution plans from planner
      6. Assign tasks to appropriate field agents (preprocess, setup, hpc, analysis)
      7. Monitor workflow progress and handle errors
      
      DECISION MAKING:
      - You control workflow routing and agent selection
      - You decide when to consult the planner
      - You coordinate between planner and field agents
      - You do NOT execute tasks directly
      - You do NOT call programmer (planner handles that internally)

  # Conversation configuration
  conversation:
    max_turns: 5  # Maximum supervisor-agent conversations per decision
    log_all_interactions: true

  # Input validation configuration
  input_validation:
    required_fields:
      - raw_pdb
      - user_goal
    pdb_search_patterns:
      - '([^\s]+/[^\s]*\.pdb)'      # Paths with directories
      - '(\./[^\s]*\.pdb)'           # Relative paths starting with ./
      - '(\.\./[^\s]*\.pdb)'         # Relative paths starting with ../
      - '([~/][^\s]*\.pdb)'          # Home directory paths
      - '(\S+\.pdb)'                 # Simple PDB filename
    
    # LLM-based goal rephrasing with PDB context
    goal_rephrase_prompt: |
      You are an expert in molecular dynamics simulations. Rephrase the user's goal into a clear, 
      unambiguous statement that captures their intent without adding assumptions.
      
      USER'S ORIGINAL GOAL:
      {user_goal}
      
      PDB FILE STRUCTURE:
      {pdb_summary}
      
      CRITICAL INSTRUCTIONS:
      1. **PRESERVE USER'S COMPONENT SELECTION EXACTLY** - If they mention specific components (protein, ligand, ions), keep exactly what they specified
      2. **DEFAULT TO CONSERVATIVE INTERPRETATION** - If user says "protein" without mentioning ligands/ions, interpret as protein ONLY
      3. Identify what workflow stages the user wants: preprocessing, setup, simulation, or analysis
      4. Pay attention to keywords like "only", "just", "retaining", "keeping", "with", "without", "remove", "exclude"
      5. Rephrase their goal clearly and concisely
      6. Do NOT add components the user didn't mention
      7. Do NOT remove components the user explicitly mentioned
      8. Do NOT add recommendations or suggestions
      9. Do NOT assume they want all stages unless explicitly stated
      10. If they say "only preprocessing" or "just preprocess", make that clear in the rephrased goal
      11. If they say "do not submit HPC" or "no analysis", explicitly state those exclusions
      
      COMPONENT INTERPRETATION RULES:
      - "protein" (alone) → ONLY protein, exclude ligands/ions (conservative default)
      - "protein only" / "just protein" → ONLY protein, exclude ligands/ions
      - "protein with ligand" / "protein and ligand" → protein + ligand
      - "retaining ligand" / "keep ligand" → INCLUDE ligand
      - "retaining ions" / "keep ions" → INCLUDE ions
      - "without ligand" / "no ligand" → EXCLUDE ligand
      - "without ions" / "no ions" → EXCLUDE ions
      - If they mention multiple components explicitly, include all mentioned components
      
      OUTPUT FORMAT:
      Provide a clear, structured rephrasing of the user's goal. Keep it brief (2-5 sentences maximum).
      Break down complex requests into key points. Explicitly state which components to include/exclude.
      No additional commentary or suggestions.
      
      EXAMPLE 1 (Protein only - conservative default):
      Original: "I want to preprocess and simulation setup of protein. The protein is available in working_dir/3.pdb"
      Rephrased: "Preprocess the PDB file to extract and clean the protein structure only. 
      Set up the simulation system for the protein (exclude ligands and ions). 
      Generate topology and coordinate files. Do not submit to HPC or run simulation."
      
      EXAMPLE 2 (Just preprocessing):
      Original: "I want to just preprocess the protein from the pdb file working_dir/3.pdb"
      Rephrased: "Preprocess the PDB file to extract and clean only the protein component. 
      Exclude ligands, ions, and water. Do not proceed to simulation setup or execution."
      
      EXAMPLE 3 (Protein with ligand and ions - explicit inclusion):
      Original: "Preprocess protein retaining ATP ligand and MG ions, then setup for simulation but don't run it"
      Rephrased: "Preprocess the PDB file keeping protein chain A, ATP ligand, and MG ions. 
      Set up the simulation system with topology and coordinates for all three components. 
      Do not submit to HPC or run simulation."
    
    # Analysis-only task rephrasing prompt
    analysis_rephrase_prompt: |
      You are an expert in molecular dynamics trajectory analysis. Rephrase the user's analysis goal 
      into a clear, unambiguous statement that captures their analytical intent.
      
      USER'S ORIGINAL GOAL:
      {user_goal}
      
      AVAILABLE FILES:
      {file_summary}
      
      CRITICAL INSTRUCTIONS:
      1. Identify what analysis calculations the user wants (RMSD, RMSF, SASA, energy, etc.)
      2. Clarify the analysis scope (whole system, specific residues, specific chains, etc.)
      3. Determine output format preferences (plots, data files, summary reports, etc.)
      4. Pay attention to keywords like "calculate", "analyze", "visualize", "compare"
      5. Rephrase their goal clearly and concisely
      6. Do NOT add analysis types the user didn't mention
      7. Do NOT make assumptions about what they want analyzed
      8. Do NOT add recommendations or suggestions
      9. Keep focus on trajectory analysis only
      
      ANALYSIS TYPE EXAMPLES:
      - "RMSD" / "structural deviation" → Root Mean Square Deviation
      - "RMSF" / "flexibility" / "fluctuation" → Root Mean Square Fluctuation
      - "SASA" / "surface area" → Solvent Accessible Surface Area
      - "energy" / "potential energy" → Energy analysis
      - "secondary structure" / "helix content" → DSSP analysis
      - "PCA" / "principal components" → Principal Component Analysis
      - "hydrogen bonds" → H-bond analysis
      - "distance analysis" / "contact maps" → Distance measurements
      
      OUTPUT FORMAT:
      Provide a clear, structured rephrasing of the analysis goal. Keep it brief (2-4 sentences maximum).
      Explicitly state which analysis calculations to perform and on which components.
      No additional commentary or suggestions.
      
      EXAMPLE 1 (Simple RMSF):
      Original: "Calculate RMSF from working_dir/hpc trajectory"
      Rephrased: "Perform Root Mean Square Fluctuation (RMSF) analysis on the trajectory data 
      in working_dir/hpc/. Calculate per-residue flexibility for the protein structure. 
      Generate RMSF plot and save data files."
      
      EXAMPLE 2 (Multiple analyses):
      Original: "I want to analyze the trajectory for RMSD and energy"
      Rephrased: "Perform two analyses on the simulation trajectory: (1) Calculate RMSD 
      to measure structural deviation from initial conformation, (2) Extract and plot 
      potential energy over simulation time. Save plots and data files for both analyses."
      
      EXAMPLE 3 (Specific scope):
      Original: "Calculate SASA for protein binding site residues 45-67"
      Rephrased: "Calculate Solvent Accessible Surface Area (SASA) specifically for 
      residues 45-67 in the protein binding site. Generate time-series plot showing 
      SASA changes during simulation."
    
    # Unified enrichment prompt - runs ONCE after input validation
    unified_enrichment_prompt: |
      You are helping to clarify and enrich a user's goal for MD simulation workflow.
      
      **User's Original Goal:**
      {user_goal}
      
      {context}
      
      **Your Task:**
      Rephrase the user's goal to be more specific, structured, and actionable for the MD workflow agents.
      Include:
      1. What needs to be done (preprocessing, setup, simulation, analysis, reporting)
      2. Which components/residues to focus on (if applicable)
      3. What specific outputs or results are expected
      4. Any constraints or special requirements
      
      **Critical Guidelines:**
      - Preserve the user's exact intent - don't add or remove steps
      - If user says "only preprocessing" or "just analysis", keep that constraint
      - If user specifies components (protein, ligand, ions), preserve exactly as stated
      - If user excludes something (no HPC, no simulation), make that explicit
      - Be concise (3-6 sentences maximum)
      - Use clear, actionable language
      
      **Output Format:**
      Provide a clear, comprehensive rephrased goal that captures the user's intent with full context.
      No additional commentary or suggestions.

  # Planner collaboration configuration
  planner:
    role: "Strategic planning and script generation coordination"
    responsibilities:
      - "Receive refined prompts from supervisor"
      - "Create detailed execution plans"
      - "Access tools and resources for planning"
      - "Request programmer to generate custom scripts when needed"
      - "Return execution plans to supervisor"
      - "Provide risk assessment and fallback strategies"
    
    create_plan_prompt: |
      You are the planner in the MD workflow system. The supervisor has analyzed the user's
      request and needs you to create a detailed execution plan.
      
      SUPERVISOR ANALYSIS:
      {supervisor_analysis}
      
      REFINED USER GOAL:
      {user_goal}
      
      CURRENT WORKFLOW STATE:
      {workflow_state}
      
      Create a comprehensive execution plan with:
      1. Step-by-step execution sequence
      2. Agent assignment for each step (preprocessing, setup, hpc, analysis)
      3. Input/output requirements for each step
      4. Tool requirements (GROMACS, VMD, Python scripts, etc.)
      5. Custom scripts needed (if any, request programmer to generate)
      6. Resource requirements (CPU, GPU, memory, time estimates)
      7. Risk assessment and fallback options
      8. Success criteria and validation checks
      9. Dependencies between steps
      10. Estimated completion timeline
      
      If custom scripts are needed, you can ask the programmer to generate them.
      Return the complete plan to the supervisor for execution.

# ========================================
# FIELD AGENT REGISTRY
# ========================================
# These are task execution specialists assigned by supervisor
agents:
  preprocessing:
    name: "PDB Preprocessing Agent"
    description: "Cleans and prepares PDB files for simulation setup. ONLY handles structure cleaning - does NOT create topology or parameter files."
    scope: "Structure preparation only"
    capabilities:
      - "Remove unwanted atoms (water, ligands, heteroatoms)"
      - "Add missing residues and atoms"
      - "Add hydrogens with correct protonation"
      - "Fix alternate conformations"
      - "Structural validation and quality checks"
    tools:
      - "reduce: Add hydrogens"
      - "pdbfixer: Fix missing atoms/residues"
      - "obabel: Structure conversion and cleaning"
      - "Bio.PDB: Python structure manipulation"
    input_requirements:
      - "raw_pdb: Path to input PDB file"
    output_provides:
      - "cleaned_pdb: Cleaned structure file (PDB format)"
    does_not_do:
      - "Topology generation (belongs to setup agent)"
      - "Force field assignment (belongs to setup agent)"
      - "MDP file creation (belongs to setup agent)"
    skip_conditions:
      - "User mentions PDB is already cleaned"
      - "User explicitly requests to skip preprocessing"

  setup:
    name: "Simulation Setup Agent"
    description: "Generates topology and prepares complete simulation system. Handles force field assignment, solvation, ionization, and parameter file creation."
    scope: "Topology and system setup"
    capabilities:
      - "Topology generation with force fields"
      - "System solvation with water models"
      - "Ion addition for physiological conditions"
      - "Simulation box definition"
      - "MDP parameter file generation"
      - "Energy minimization setup"
      - "Equilibration procedures"
    tools:
      - "gmx pdb2gmx: Generate topology"
      - "gmx solvate: Add water"
      - "gmx genion: Add ions"
      - "gmx editconf: Define simulation box"
      - "acpype: Small molecule topology"
    input_requirements:
      - "cleaned_pdb: Processed structure from preprocessing"
    output_provides:
      - "topology: System topology (.top)"
      - "coordinates: Simulation-ready structure (.gro)"
      - "mdp_files: Simulation parameters (.mdp)"
    skip_conditions:
      - "User mentions simulation is already set up"
      - "User provides ready-to-run simulation files"

  hpc:
    name: "HPC Job Submission Agent"
    description: "Handles high-performance computing job submission and monitoring. Manages queue systems and resource allocation."
    capabilities:
      - "SLURM/PBS job script generation"
      - "Resource requirement estimation"
      - "Job submission and monitoring"
      - "Queue management"
    input_requirements:
      - "coordinates: Simulation system"
      - "mdp_files: Simulation parameters"
    output_provides:
      - "job_id: HPC job identifier"
      - "job_status: Submission status"
    skip_conditions:
      - "User wants local simulation"
      - "User has already submitted jobs"

  analysis:
    name: "Trajectory Analysis Agent"
    description: "Performs post-simulation analysis of MD trajectories. Calculates structural and dynamic properties."
    capabilities:
      - "RMSD/RMSF calculations"
      - "Secondary structure analysis"
      - "Energy analysis"
      - "Custom property calculations"
    input_requirements:
      - "trajectory: MD trajectory files"
      - "coordinates: Reference structure"
    output_provides:
      - "analysis_results: Analysis data and plots"
    skip_conditions:
      - "User only wants simulation setup"
      - "Simulation is still running"

# ========================================
# WORKFLOW PIPELINE CONFIGURATION
# ========================================
workflow:
  # Default execution order for field agents
  default_pipeline:
    - "preprocessing"
    - "setup"
    - "hpc"
    - "analysis"

  # Entry points (where users can start based on their data stage)
  entry_points:
    - "preprocessing"
    - "setup"
    - "hpc"
    - "analysis"
