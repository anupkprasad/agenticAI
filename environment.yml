# AgenticAI Conda Environment - ollama_env
# ==========================================
#
# This environment provides molecular dynamics simulation, analysis,
# and LLM-powered workflow automation capabilities.
#
# For detailed software documentation, see: AVAILABLE_SOFTWARE.md
#
# Recreation:
#   conda env create -f environment.yml
#
name: ollama_env
channels:
  - conda-forge
dependencies:
  # ===== Core Python =====
  - python=3.11.14
  
  # ===== Molecular Dynamics Simulation =====
  - gromacs=2025.4              # gmx - MD simulation suite with 50+ analysis tools
  - ambertools=24.8             # Includes: sander, cpptraj, antechamber, tleap, pdb4amber
  
  # ===== Structure and Chemistry Tools =====
  - openbabel=3.1.1             # obabel - Chemical format conversion
  - parmed=4.3.0                # Amber/GROMACS topology editor
  
  # ===== Scientific Python Stack =====
  - numpy=2.4.1                 # Numerical arrays and linear algebra
  - scipy=1.17.0                # Scientific computing and optimization
  - pandas=3.0.0                # Data manipulation and analysis
  - matplotlib-base=3.10.8      # 2D plotting and visualization
  
  # ===== LLM and Agentic AI Framework =====
  - langgraph=1.0.7             # Stateful multi-agent workflows
  - langgraph-checkpoint=4.0.0  # Checkpoint system
  - langgraph-prebuilt=1.0.7    # Prebuilt agent components
  - langgraph-sdk=0.3.3         # SDK utilities
  
  # ===== Network and Remote Execution =====
  - paramiko=4.0.0              # SSH client for HPC job submission
  - requests=2.32.5             # HTTP client
  
  # ===== Data Serialization =====
  - pyyaml=6.0.3                # YAML parser
  - orjson=3.11.5               # Fast JSON parser
  - ormsgpack=1.12.2            # MessagePack serialization
  
  # ===== Testing =====
  - pytest=9.0.2                # Testing framework
  - invoke=2.2.1                # Task execution
  
  # ===== Pip-installed packages =====
  - pip:
      # === Molecular Dynamics Analysis ===
      - mdanalysis==2.10.0      # Trajectory analysis framework
      - pytraj==2.0.6           # Amber trajectory analysis
      
      # === Chemistry and Structure ===
      - rdkit==2025.9.3         # Cheminformatics toolkit
      - biopython               # Biological computation
      - acpype==2023.10.27      # AMBER to GROMACS converter
      - openbabel-wheel==3.1.1.22  # OpenBabel Python bindings
      
      # === Amber/AmberTools Python Modules ===
      - amberutils==21.0        # Amber utility functions
      - pdb4amber==22.0         # PDB preparation for Amber
      - pymsmt==22.0            # Metal site modeling
      - sander==22.0            # Amber MD engine Python bindings
      - mmpbsa-py==16.0         # MM-PBSA analysis
      - edgembar==3.0           # Edge-based analysis
      
      # === Structure Preparation ===
      - pdb2pqr==3.7.1          # Add hydrogens and charges to PDB
      - propka==3.5.1           # pKa prediction
      - packmol-memgen==2025.1.29  # Membrane system builder
      
      # === LLM and AI ===
      - langchain==1.2.8        # LLM application framework
      - langchain-core==1.2.8   # LangChain core components
      - langsmith==0.6.4        # LangSmith tracing
      - ollama==0.6.1           # Local LLM inference client
      
      # === Visualization ===
      - seaborn==0.13.2         # Statistical visualization
      
      # === Data Utilities ===
      - tqdm==4.67.3            # Progress bars
      - uuid-utils==0.14.0      # UUID utilities

prefix: /home/akp66103/conda_envs/ollama_env
